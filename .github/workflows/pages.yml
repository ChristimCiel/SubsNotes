name: Publish fictional demo
on:
  push:
    branches: [main]
    paths:
      - renew-before-demo/dist/**
      - renew-before-service/src/**
      - renew-before-service/scripts/package-claude-web.mjs
      - renew-before-service/scripts/package-confirmation-demo.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run package:confirmation-demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: renew-before-demo/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
