name: Baseline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: renew-before-service/package-lock.json
      - run: npm ci --prefix renew-before-service --ignore-scripts
      - run: node --test scripts/check-publication.test.mjs
      - run: node scripts/check-publication.mjs
      - run: npm test
      - run: npm run check:demo
      - run: npm run sample
      - run: npm run package:confirmation-demo
      - run: node --check renew-before-demo/dist/confirmations.js
      - run: npm run package:skill
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: renew-before-mac
      - run: python3 Scripts/check-service-logos.py
        working-directory: renew-before-mac
